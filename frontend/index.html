<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/renap-icon.svg" />
    <!-- viewport: evita que los móviles usen ancho de escritorio (980px) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a237e" />
    <!-- Fuerza modo móvil en Safari iOS — sin esto ignora el viewport -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Impide que IE/Edge antiguo use modo compatibilidad -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="description" content="Sistema de Informes — Hospital Regional de Occidente" />
    <title>HRO — Sistema de Informes</title>
    <!--
      config.js es generado al arrancar el contenedor Docker por docker-entrypoint.sh.
      Expone window.__APP_CONFIG__ con las variables de entorno runtime.
      En desarrollo (npm run dev) este script no existe — el código usa valores fallback.
    -->
    <script src="/config.js" onerror="console.warn('config.js no encontrado — usando valores por defecto')"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
