server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Headers que ayudan a la responsividad y compatibilidad
    add_header X-UA-Compatible "IE=edge" always;
    add_header X-Content-Type-Options "nosniff" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        # Sin cache en index.html para que el viewport meta siempre cargue fresco
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header X-UA-Compatible "IE=edge";
    }

    # Proxy API al backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts generosos — el backend Spring Boot tarda ~50s en arrancar
        proxy_connect_timeout       10s;
        proxy_send_timeout          60s;
        proxy_read_timeout          60s;

        # Reintentar en caso de error de conexión (backend arrancando)
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries   3;
        proxy_next_upstream_timeout 30s;
    }

    # No cachear config.js — contiene variables de entorno runtime inyectadas
    location = /config.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Cache para assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
