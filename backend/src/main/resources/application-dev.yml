spring:
  datasource:
    url: jdbc:mysql://localhost:3308/renap_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Guatemala
    username: renap_user
    password: renap_pass

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

  liquibase:
    enabled: false

logging:
  level:
    com.renap: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
